<header class="header" data-sly-use.headerLogic="com.hiero.ecom.core.models.HeaderModel">
  <div class="header__container">
    <a href="/" class="header__logo" aria-label="Hiero eCommerce Home">
      <img src="${headerLogic.logoUrl}" alt="Hiero Logo" width="40" height="40" />
      <span>Hiero</span>
    </a>

    <nav class="header__nav" aria-label="Main Navigation">
      <ul class="header__nav-list">
        <sly data-sly-list.item="${headerLogic.navigationItems}">
          <li class="header__nav-item">
            <a
              href="${item.url}"
              class="header__nav-link"
              data-nav-link
              aria-current="${item.active ? 'true' : 'false'}"
            >
              ${item.title}
            </a>
          </li>
        </sly>
      </ul>
    </nav>

    <div class="header__actions">
      <div class="header__search">
        <button
          class="header__search-toggle"
          data-search-toggle
          aria-label="Open search"
          aria-expanded="false"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <form class="header__search-form" data-search-form data-open="false">
          <input
            type="search"
            class="header__search-input"
            name="q"
            placeholder="Search products..."
            aria-label="Search for products"
          />
        </form>
      </div>

      <a
        href="${headerLogic.wishlistUrl}"
        class="header__action-link"
        aria-label="Wishlist (${headerLogic.wishlistCount} items)"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </a>

      <a href="${headerLogic.cartUrl}" class="header__action-link" aria-label="Shopping Cart">
        <div style="position: relative; display: inline-flex;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="header__cart-badge" data-cart-count="${headerLogic.cartCount}">${headerLogic.cartCount}</span>
        </div>
      </a>
    </div>

    <button
      class="header__menu-toggle"
      data-header-toggle
      aria-label="Toggle navigation menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="header__mobile-menu" data-header-menu data-open="false" id="mobile-menu">
      <ul class="header__mobile-nav-list">
        <sly data-sly-list.item="${headerLogic.navigationItems}">
          <li class="header__mobile-nav-item">
            <a
              href="${item.url}"
              class="header__mobile-nav-link"
              data-nav-link
              aria-current="${item.active ? 'true' : 'false'}"
            >
              ${item.title}
            </a>
          </li>
        </sly>
      </ul>
    </div>
  </div>
</header>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const headerElement = document.querySelector('.header');
    if (headerElement && window.Header) {
      new window.Header(headerElement);
    }
  });
</script>
