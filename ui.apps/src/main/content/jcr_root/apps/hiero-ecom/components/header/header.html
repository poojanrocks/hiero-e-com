<sly data-sly-use.headerModel="com.hiero.ecom.core.models.HeaderModel">
  <sly data-sly-use.clientLib="/libs/granite/sightly/templates/clientlib.html"
       data-sly-call="${clientLib.all @ categories=['hiero-ecom.header']}"></sly>

  <header class="header" role="banner"
          data-test="header"
          data-logo-src="${headerModel.logoSrc}"
          data-logo-alt="${headerModel.logoAlt}"
          data-home-url="${headerModel.homeUrl}">
    <div class="header__container">
      <div class="header__logo">
        <a href="${headerModel.homeUrl}" class="header__logo-link" aria-label="Home">
          <img src="${headerModel.logoSrc}" alt="${headerModel.logoAlt}" class="header__logo-image" />
        </a>
      </div>

      <button class="header__menu-toggle"
              aria-expanded="false"
              aria-controls="mobile-menu"
              aria-label="Toggle navigation menu">
        <span class="header__menu-icon"></span>
        <span class="header__menu-icon"></span>
        <span class="header__menu-icon"></span>
      </button>

      <nav class="header__nav" id="mobile-menu" role="navigation" aria-label="Main navigation"
           data-test="navigation">
        <sly data-sly-test="${headerModel.navigationItems}">
          <ul class="navigation">
            <sly data-sly-list="${headerModel.navigationItems}">
              <li class="navigation__item">
                <a href="${item.url}"
                   class="navigation__link ${item.active ? 'navigation__link--active' : ''}"
                   aria-current="${item.active ? 'page' : @}
                   data-test="nav-item">${item.label}</a>
              </li>
            </sly>
          </ul>
        </sly>
      </nav>

      <div class="header__actions">
        <button class="header__search-toggle"
                aria-expanded="false"
                aria-label="Toggle search"
                data-test="search-toggle">
          <svg class="icon icon--search" aria-hidden="true">
            <use href="#icon-search"></use>
          </svg>
        </button>

        <a href="/wishlist" class="wishlist-link"
           aria-label="Wishlist"
           data-test="wishlist-link">
          <svg class="icon icon--heart" aria-hidden="true">
            <use href="#icon-heart"></use>
          </svg>
          <span class="wishlist-link__badge" data-test="wishlist-count"></span>
        </a>

        <a href="/cart" class="cart-link"
           aria-label="Shopping cart"
           data-test="cart-link">
          <svg class="icon icon--cart" aria-hidden="true">
            <use href="#icon-cart"></use>
          </svg>
          <span class="cart-link__badge" data-test="cart-count"></span>
        </a>
      </div>
    </div>

    <div class="header__search-panel" role="search" style="display: none;" data-test="search-panel">
      <form class="search__form" data-test="search-form">
        <label for="search-input" class="sr-only">Search products</label>
        <input id="search-input" type="text" class="search__input"
               placeholder="Search products..."
               aria-autocomplete="list"
               aria-label="Search products"
               data-test="search-input" />
        <button type="submit" class="search__button" aria-label="Search">
          <svg class="icon icon--search" aria-hidden="true">
            <use href="#icon-search"></use>
          </svg>
        </button>
      </form>
      <div id="search-results" class="search__results" role="listbox" data-test="search-results"></div>
    </div>
  </header>
</sly>
