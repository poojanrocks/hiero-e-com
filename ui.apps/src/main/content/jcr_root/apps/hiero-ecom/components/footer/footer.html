<sly data-sly-use.model="com.hiero.ecom.core.models.FooterModel">
<footer class="hiero-ecom-footer" data-footer-component="main" role="contentinfo">
    <div class="hiero-ecom-footer__container">
        <div class="hiero-ecom-footer__content">
            <sly data-sly-list.group="${model.footerGroups}">
                <div class="hiero-ecom-footer__group" 
                     data-footer-group 
                     data-footer-group-open="false">
                    <button class="hiero-ecom-footer__group-toggle" 
                            data-footer-group-toggle
                            aria-expanded="false"
                            aria-label="Toggle ${group.title}">
                        <span class="hiero-ecom-footer__group-title">${group.title}</span>
                    </button>
                    <div class="hiero-ecom-footer__group-items" role="navigation">
                        <sly data-sly-list.item="${group.items}">
                            <a href="${item.href}" 
                               class="hiero-ecom-footer__link"
                               aria-label="${item.ariaLabel || item.label}">
                                ${item.label}
                            </a>
                        </sly>
                    </div>
                </div>
            </sly>
        </div>

        <div class="hiero-ecom-footer__bottom">
            <p class="hiero-ecom-footer__copyright">
                &copy; ${model.currentYear} ${model.companyName}. All rights reserved.
            </p>
            <div class="hiero-ecom-footer__social" role="list" aria-label="Social media links">
                <sly data-sly-list.social="${model.socialLinks}">
                    <a href="${social.url}" 
                       class="hiero-ecom-footer__social-link" 
                       aria-label="${social.label}"
                       target="_blank"
                       rel="noopener noreferrer">
                        ${social.icon}
                    </a>
                </sly>
            </div>
        </div>
    </div>
</footer>
</sly>
