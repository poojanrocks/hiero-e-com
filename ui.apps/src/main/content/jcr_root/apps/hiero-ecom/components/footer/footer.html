<footer class="footer" data-sly-use.footerModel="com.hiero.ecom.core.models.FooterModel">
  <div class="footer__container">
    <div class="footer__grid">
      <sly data-sly-list.section="${footerModel.sections}">
        <section class="footer__section" data-sly-test="${section.links}">
          <button class="footer__section-title" 
                  data-expandable
                  aria-controls="section-${sectionList.index}"
                  aria-expanded="false">
            ${section.title}
          </button>
          <div id="section-${sectionList.index}" class="footer__section-content">
            <sly data-sly-list.link="${section.links}">
              <a href="${link.url}" 
                 class="footer__link" 
                 data-sly-test="${link.url}">
                ${link.label}
              </a>
            </sly>
          </div>
        </section>
      </sly>
    </div>

    <div class="footer__bottom">
      <div class="footer__copyright">
        <p>${footerModel.copyrightText}</p>
      </div>
      <div class="footer__social" data-sly-test="${footerModel.socialLinks}">
        <sly data-sly-list.social="${footerModel.socialLinks}">
          <a href="${social.url}" 
             class="footer__social-link" 
             aria-label="${social.label}"
             target="_blank"
             rel="noopener noreferrer">
            ${social.icon @ context='html'}
          </a>
        </sly>
      </div>
    </div>
  </div>
</footer>
