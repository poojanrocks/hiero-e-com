<sly data-sly-use.model="com.hiero.ecom.core.models.HeaderModel"
     data-sly-use.templates="/libs/wcm/foundation/components/parsys/parsys.html">
<header class="hiero-ecom-header" data-header-component="main" role="banner">
    <div class="hiero-ecom-header__container">
        <a href="${model.logoLink}" class="hiero-ecom-header__logo" aria-label="Home">
            ${model.logoText}
        </a>

        <nav class="hiero-ecom-header__nav" aria-label="Main navigation">
            <sly data-sly-list.item="${model.navigationItems}">
                <a href="${item.href}" 
                   class="hiero-ecom-header__nav-link" 
                   data-nav-link
                   aria-label="${item.ariaLabel || item.label}">
                    ${item.label}
                </a>
            </sly>
        </nav>

        <div class="hiero-ecom-header__search" role="search">
            <form data-search-form>
                <input type="search" 
                       class="hiero-ecom-header__search-input" 
                       data-search-input
                       placeholder="Search products..."
                       aria-label="Search products">
            </form>
            <div data-search-results aria-live="polite"></div>
        </div>

        <div class="hiero-ecom-header__actions">
            <button class="hiero-ecom-header__action-button" 
                    data-search-toggle 
                    aria-label="Open search" 
                    aria-expanded="false"
                    title="Search">
                🔍
            </button>
            <button class="hiero-ecom-header__action-button" 
                    data-wishlist-toggle 
                    aria-label="Wishlist" 
                    title="Wishlist">
                ❤️
                <span class="hiero-ecom-header__wishlist-count" 
                      data-wishlist-count="${model.wishlistCount}" 
                      aria-label="${model.wishlistCount} items in wishlist"></span>
            </button>
            <button class="hiero-ecom-header__action-button" 
                    data-cart-toggle 
                    aria-label="Shopping cart" 
                    title="Cart">
                🛒
                <span class="hiero-ecom-header__cart-count" 
                      data-cart-count="${model.cartCount}" 
                      aria-label="${model.cartCount} items in cart"></span>
            </button>
            <button class="hiero-ecom-header__menu-toggle" 
                    data-header-menu-toggle 
                    aria-label="Toggle menu" 
                    aria-expanded="false">
                ☰
            </button>
        </div>

        <div class="hiero-ecom-header__mobile-menu" data-mobile-menu-open="false" role="navigation" aria-label="Mobile navigation">
            <button class="hiero-ecom-header__action-button" 
                    data-header-menu-close 
                    aria-label="Close menu">
                ✕
            </button>
            <nav class="hiero-ecom-header__mobile-nav">
                <sly data-sly-list.item="${model.navigationItems}">
                    <a href="${item.href}" 
                       class="hiero-ecom-header__mobile-nav-link" 
                       data-nav-link
                       aria-label="${item.ariaLabel || item.label}">
                        ${item.label}
                    </a>
                </sly>
            </nav>
        </div>
    </div>
</header>
</sly>
