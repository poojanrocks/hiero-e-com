<sly data-sly-use.header="com.hiero.ecom.core.models.HeaderModel"
     data-sly-attribute.data-header-config="${header.headerConfig @ context='scriptString'}"
     class="header-container" id="app-header">
  <!-- Header component is rendered by TypeScript/React in ui.frontend -->
  <!-- The HTL provides the container and data attributes for initialization -->
  <div data-component="header" 
       data-navigation="${header.navigationItems @ context='scriptString'}" 
       data-logo="${header.logoUrl}"
       data-logo-alt="${header.logoAlt}"></div>
</sly>
