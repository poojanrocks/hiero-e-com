<footer
  class="footer"
  role="contentinfo"
  data-component="footer"
  data-columns="${footer.columns @ context='html'}"
  data-company-name="${footer.companyName @ context='html'}"
  data-social-links="${footer.socialLinks @ context='html'}">
  <div class="footer__container">
    <div class="footer__content">
      <sly data-sly-test="${footer.columns}">
        <div class="footer__columns">
          <sly data-sly-list="${footer.columns}">
            <div class="footer__column">
              <h3 class="footer__column-title">${item.title}</h3>
              <ul class="footer__links">
                <sly data-sly-list="${item.links}">
                  <li class="footer__link-item">
                    <a href="${item.url}" class="footer__link">${item.label}</a>
                  </li>
                </sly>
              </ul>
            </div>
          </sly>
        </div>
      </sly>
    </div>

    <sly data-sly-test="${footer.socialLinks}">
      <div class="footer__social">
        <h3 class="footer__social-title">Follow Us</h3>
        <ul class="footer__social-list">
          <sly data-sly-list="${footer.socialLinks}">
            <li class="footer__social-item">
              <a
                href="${item.url}"
                class="footer__social-link"
                aria-label="${item.label}"
                target="_blank"
                rel="noopener noreferrer">
                <span class="footer__social-icon">${item.icon}</span>
              </a>
            </li>
          </sly>
        </ul>
      </div>
    </sly>
  </div>

  <div class="footer__bottom">
    <p class="footer__copyright">
      &copy; <span id="footer-year"></span> ${footer.companyName}. All rights reserved.
    </p>
    <nav class="footer__legal" aria-label="Legal navigation">
      <a href="/privacy" class="footer__legal-link">Privacy Policy</a>
      <a href="/terms" class="footer__legal-link">Terms of Service</a>
      <a href="/cookies" class="footer__legal-link">Cookie Settings</a>
    </nav>
  </div>
</footer>
