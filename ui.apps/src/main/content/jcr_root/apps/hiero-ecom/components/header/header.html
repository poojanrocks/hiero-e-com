<header
  class="header"
  role="banner"
  data-component="header"
  data-navigation="${header.navigationItems @ context='html'}"
  data-logo-url="${header.logoUrl @ context='html'}"
  data-logo-alt="${header.logoAlt @ context='html'}"
  data-search-placeholder="${header.searchPlaceholder @ context='html'}">
  <div class="header__container">
    <div class="header__logo">
      <a href="/" aria-label="Home">
        <img src="${header.logoUrl}" alt="${header.logoAlt}" />
      </a>
    </div>

    <nav class="header__nav" role="navigation" aria-label="Main navigation">
      <ul class="header__nav-list">
        <sly data-sly-list="${header.navigationItems}">
          <li class="header__nav-item">
            <a href="${item.url}" class="header__nav-link">${item.label}</a>
          </li>
        </sly>
      </ul>
    </nav>

    <div class="header__actions" id="header-actions">
      <button
        class="header__action-btn header__search-btn"
        aria-label="Search"
        aria-expanded="false"
        aria-controls="search-form">
        <span class="header__icon">🔍</span>
      </button>

      <a href="/wishlist" class="header__action-btn header__wishlist-btn" aria-label="Wishlist">
        <span class="header__icon">♡</span>
        <span class="header__badge" id="wishlist-count"></span>
      </a>

      <a href="/cart" class="header__action-btn header__cart-btn" aria-label="Cart">
        <span class="header__icon">🛒</span>
        <span class="header__badge" id="cart-count"></span>
      </a>

      <button
        class="header__menu-toggle"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="mobile-menu">
        <span class="header__hamburger"></span>
      </button>
    </div>
  </div>

  <div class="header__search" id="header-search" style="display: none;">
    <form id="search-form" class="header__search-form">
      <input
        type="text"
        class="header__search-input"
        placeholder="${header.searchPlaceholder}"
        aria-label="Search query" />
      <button type="submit" class="header__search-submit" aria-label="Submit search">
        Search
      </button>
    </form>
  </div>

  <nav id="mobile-menu" class="header__mobile-menu" style="display: none;" role="navigation" aria-label="Mobile navigation">
    <ul class="header__mobile-menu-list">
      <sly data-sly-list="${header.navigationItems}">
        <li class="header__mobile-menu-item">
          <a href="${item.url}" class="header__mobile-menu-link">${item.label}</a>
        </li>
      </sly>
    </ul>
  </nav>
</header>
