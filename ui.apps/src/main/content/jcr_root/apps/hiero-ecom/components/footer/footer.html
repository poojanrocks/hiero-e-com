<div class="hiero-footer-wrapper"
  data-sly-use.footer="com.hiero.ecom.core.models.FooterModel"
  data-sly-attribute="${footer.attributes}">
  
  <sly data-sly-template.footerTemplate>
    <!-- Footer markup will be generated by TypeScript component -->

  <!-- Include footer template -->
  <sly data-sly-call="${footerTemplate}"></sly>
</div>
