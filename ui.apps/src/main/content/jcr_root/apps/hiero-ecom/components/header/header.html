<header class="header" id="header" data-sly-use.model="com.hiero.ecom.core.models.HeaderModel">
  <div class="header__inner">
    <!-- Logo -->
    <a href="${model.homePath}" class="header__logo" data-sly-test="${model.logoPath}">
      <img src="${model.logoPath}" alt="${model.storeName}"/>
    </a>
    <div class="header__logo" data-sly-test="${!model.logoPath}">
      ${model.storeName}
    </div>

    <!-- Desktop Navigation -->
    <nav class="header__nav" data-nav-links>
      <ul>
        <li class="header__nav-item" data-sly-repeat="${model.navigationItems}">
          <a href="${item.url}" 
             class="${item.active ? 'active' : ''}" 
             data-nav-link>
            ${item.label}
          </a>
        </li>
      </ul>
    </nav>

    <!-- Search (Desktop) -->
    <div class="header__search" data-search-container>
      <input type="text" 
             placeholder="Search products..." 
             data-search-input 
             aria-label="Search products" />
      <button type="button" aria-label="Submit search">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.5 1C12.6421 1 16 4.35786 16 8.5C16 10.2957 15.3213 11.9499 14.192 13.1497L19.3536 18.3111C19.7441 18.7016 19.7441 19.3348 19.3536 19.7253C18.963 20.1159 18.3299 20.1159 17.9393 19.7253L12.7777 14.5639C11.5779 15.693 9.92371 16.371 8.12762 16.371C3.98576 16.371 0.628203 13.0135 0.628203 8.87163C0.628203 4.72977 3.98576 1.37221 8.12762 1.37221" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Actions -->
    <ul class="header__actions">
      <!-- Wishlist -->
      <li>
        <button class="header__action-btn" 
                data-wishlist-button 
                data-wishlist-url="${model.wishlistPath}"
                aria-label="Wishlist">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-wishlist-badge class="header__badge" aria-label="0 items in wishlist">0</span>
        </button>
      </li>

      <!-- Cart -->
      <li>
        <button class="header__action-btn" 
                data-cart-button 
                data-cart-url="${model.cartPath}"
                aria-label="Shopping cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-cart-badge class="header__badge" aria-label="0 items in cart">0</span>
        </button>
      </li>
    </ul>

    <!-- Mobile Menu Toggle -->
    <button class="hamburger" 
            data-toggle="mobile-menu" 
            aria-label="Toggle menu" 
            aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav class="header__mobile-menu" data-mobile-menu aria-hidden="true">
    <ul class="header__mobile-menu">
      <li data-sly-repeat="${model.navigationItems}" class="header__mobile-menu-item">
        <a href="${item.url}" data-nav-link>${item.label}</a>
      </li>
    </ul>
  </nav>
</header>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const { Header } = window.HieroEcom;
    if (Header) {
      const header = new Header('header');
      header.init();
    }
  });
</script>
