<sly data-sly-use.footer="com.hiero.ecom.core.models.FooterModel"
     data-sly-attribute.data-footer-config="${footer.footerConfig @ context='scriptString'}"
     class="footer-container" id="app-footer">
  <!-- Footer component is rendered by TypeScript/React in ui.frontend -->
  <!-- The HTL provides the container and data attributes for initialization -->
  <div data-component="footer"
       data-company-name="${footer.companyName}"
       data-links="${footer.footerLinks @ context='scriptString'}"
       data-social-links="${footer.socialLinks @ context='scriptString'}"
       data-copyright="${footer.copyright}"></div>
</sly>
