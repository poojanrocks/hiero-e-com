<header class="header" data-sly-use.headerModel="com.hiero.ecom.core.models.HeaderModel">
  <div class="header__container">
    <a href="/" class="header__logo" title="Go to homepage">${headerModel.siteName}</a>
    
    <nav class="header__nav" data-mobile-menu aria-label="Main navigation" aria-hidden="true">
      <sly data-sly-list.item="${headerModel.navigationItems}">
        <a href="${item.url}" 
           class="header__nav-item" 
           data-nav-item
           data-sly-test="${item.url}"
           aria-current="${item.active ? 'page' : 'false'}">
          ${item.label}
        </a>
      </sly>
    </nav>

    <div class="header__actions">
      <button class="header__action-btn" 
              data-search-toggle 
              aria-label="Toggle search"
              aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </button>

      <button class="header__action-btn header__mobile-toggle" 
              data-mobile-menu-toggle 
              aria-label="Toggle menu"
              aria-expanded="false"
              aria-controls="mobile-menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="/cart" class="header__action-btn" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="header__badge" data-cart-count></span>
      </a>

      <a href="/wishlist" class="header__action-btn" aria-label="Wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span class="header__badge" data-wishlist-count></span>
      </a>
    </div>

    <div class="header__search-box" data-search-box aria-hidden="true" role="search">
      <input type="text" 
             class="header__search-input" 
             data-search-input 
             placeholder="Search products..."
             aria-label="Search products" />
      <div class="header__search-results" data-search-results role="listbox" aria-label="Search results"></div>
    </div>
  </div>
</header>
