<footer class="footer" data-sly-use.footerLogic="com.hiero.ecom.core.models.FooterModel">
  <div class="footer__container">
    <div class="footer__content">
      <div class="footer__section footer__accordion" data-footer-accordion data-open="true">
        <button
          class="footer__accordion-trigger"
          data-accordion-trigger
          aria-expanded="true"
          aria-label="Company Information Section"
        >
          <span>Company</span>
          <span class="footer__accordion-icon">▼</span>
        </button>
        <div class="footer__accordion-content">
          <ul class="footer__link-list">
            <sly data-sly-list.link="${footerLogic.companyLinks}">
              <li class="footer__link-item">
                <a href="${link.url}" class="footer__link">${link.title}</a>
              </li>
            </sly>
          </ul>
        </div>
      </div>

      <div class="footer__section footer__accordion" data-footer-accordion data-open="true">
        <button
          class="footer__accordion-trigger"
          data-accordion-trigger
          aria-expanded="true"
          aria-label="Customer Support Section"
        >
          <span>Support</span>
          <span class="footer__accordion-icon">▼</span>
        </button>
        <div class="footer__accordion-content">
          <ul class="footer__link-list">
            <sly data-sly-list.link="${footerLogic.supportLinks}">
              <li class="footer__link-item">
                <a href="${link.url}" class="footer__link">${link.title}</a>
              </li>
            </sly>
          </ul>
        </div>
      </div>

      <div class="footer__section footer__accordion" data-footer-accordion data-open="true">
        <button
          class="footer__accordion-trigger"
          data-accordion-trigger
          aria-expanded="true"
          aria-label="Legal Section"
        >
          <span>Legal</span>
          <span class="footer__accordion-icon">▼</span>
        </button>
        <div class="footer__accordion-content">
          <ul class="footer__link-list">
            <sly data-sly-list.link="${footerLogic.legalLinks}">
              <li class="footer__link-item">
                <a href="${link.url}" class="footer__link">${link.title}</a>
              </li>
            </sly>
          </ul>
        </div>
      </div>

      <div class="footer__section footer__newsletter">
        <h3 class="footer__section-title">Newsletter</h3>
        <form class="footer__newsletter-form" data-newsletter-form method="POST" action="${footerLogic.newsletterActionUrl}">
          <input
            type="email"
            name="email"
            class="footer__newsletter-input"
            placeholder="Your email address"
            aria-label="Enter your email to subscribe"
            required
          />
          <button type="submit" class="footer__newsletter-button">Subscribe</button>
        </form>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copyright">${footerLogic.copyrightText}</p>
      <div class="footer__social-links" role="list">
        <sly data-sly-list.social="${footerLogic.socialLinks}">
          <a
            href="${social.url}"
            class="footer__social-link"
            aria-label="${social.label}"
            role="listitem"
          >
            ${social.icon}
          </a>
        </sly>
      </div>
    </div>
  </div>
</footer>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const footerElement = document.querySelector('.footer');
    if (footerElement && window.Footer) {
      new window.Footer(footerElement);
    }
  });
</script>
